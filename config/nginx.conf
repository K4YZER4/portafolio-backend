server {
    listen __PORT__;
    server_name _;

    # Límite de subida (para carga de contratos PDF e imágenes)
    client_max_body_size 25M;

    # 1. Health check de Render
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # 2. Proxy para RITMO API (:3001)
    location /ritmo/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # 3. Proxy para PDF-FILLER API (:3002)
    location /pdf/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 15s;
    }

    # 4. Fallback informativa en raíz
    location = / {
        default_type application/json;
        return 200 '{"status":"online","service":"Portfolio Multi-Backend","routes":{"ritmo":"/ritmo/","pdf_filler":"/pdf/","health":"/health"}}\n';
    }
}
